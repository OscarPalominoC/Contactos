services:
  db:
    image: postgres:17-alpine
    container_name: check_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: check_contactos
      POSTGRES_USER: check_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anWYoYdg2YBGup3g9L-ykdqozKCKaJ19}
    volumes:
      - check_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      # Host:Contenedor restringido únicamente a localhost
      - "127.0.0.1:${CHECK_DB_PORT:-5435}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U check_app -d check_contactos" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: check_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Valores de respaldo o sobrescritura para Docker/Nginx
      DATABASE_URL: postgres://check_app:${DB_PASSWORD:-anWYoYdg2YBGup3g9L-ykdqozKCKaJ19}@db:5432/check_contactos
      ALLOWED_HOSTS: localhost,127.0.0.1,oscarpalomino.dev,www.oscarpalomino.dev,72.61.0.102,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5177,http://72.61.0.102:5177,https://oscarpalomino.dev,https://www.oscarpalomino.dev
      ADMIN_URL: ${ADMIN_URL:-gestion-c2447da1/}
      CARGAR_BASE_DATOS: ${CARGAR_BASE_DATOS:-false}
      DUMP_SQL_PATH: /data/CONTACTOS_recuperado_2026-11-07.sql
      CLAVE_TEMPORAL_INICIAL: ${CLAVE_TEMPORAL_INICIAL:-CheckLTDA!}
    volumes:
      - ./CONTACTOS_recuperado_2026-11-07.sql:/data/CONTACTOS_recuperado_2026-11-07.sql:ro
      - ./CREDENCIALES_TEMPORALES.md:/app/CREDENCIALES_TEMPORALES.md
      - check_backend_keys:/app/backend/keys
      - check_backend_logs:/app/logs
      - check_static:/app/backend/staticfiles
    ports:
      - "127.0.0.1:${CHECK_BACKEND_PORT:-8004}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/salud || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: check_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_PORT: 5177
      PORT: 5177
    ports:
      - "127.0.0.1:${CHECK_FRONTEND_PORT:-5177}:5173"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  check_pg_data:
  check_backend_keys:
  check_backend_logs:
  check_static:
