services:
  db:
    image: postgres:17-alpine
    container_name: check_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: check_contactos
      POSTGRES_USER: check_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-check_secure_password_2026}
    volumes:
      - check_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${CHECK_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U check_app -d check_contactos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: check_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-bD9jU2AybsJrl9X84J8VkMS0JHy9qTWojj8KuwepgvpC4TsiECaLBaZaCyz6zJtq3CY}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,0.0.0.0,192.168.1.50,*
      DATABASE_URL: postgres://check_app:${DB_PASSWORD:-check_secure_password_2026}@db:5432/check_contactos
      JWT_PRIVATE_KEY_PATH: keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: keys/jwt_public.pem
      JWT_ISSUER: check-contactos
      JWT_AUDIENCE: check-contactos-web
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:${CHECK_FRONTEND_PORT:-5174},http://127.0.0.1:${CHECK_FRONTEND_PORT:-5174}
      ADMIN_URL: ${ADMIN_URL:-gestion-c2447da1/}
      CARGAR_BASE_DATOS: ${CARGAR_BASE_DATOS:-true}
      DUMP_SQL_PATH: /data/CONTACTOS_recuperado_2026-11-07.sql
      CLAVE_TEMPORAL_INICIAL: ${CLAVE_TEMPORAL_INICIAL:-CheckLTDA!}
    volumes:
      - ./CONTACTOS_recuperado_2026-11-07.sql:/data/CONTACTOS_recuperado_2026-11-07.sql:ro
      - ./CREDENCIALES_TEMPORALES.md:/app/CREDENCIALES_TEMPORALES.md
      - check_backend_keys:/app/backend/keys
      - check_backend_logs:/app/logs
      - check_static:/app/backend/staticfiles
      - "C:\\:/mnt/c"
      - "D:\\:/mnt/d"
      - "F:\\:/mnt/f"
    ports:
      - "${CHECK_BACKEND_PORT:-8080}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: check_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CHECK_FRONTEND_PORT:-5174}:5173"

volumes:
  check_pg_data:
  check_backend_keys:
  check_backend_logs:
  check_static:

